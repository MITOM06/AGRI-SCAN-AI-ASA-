name: agri-scan-ai

services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: asa-nginx-proxy
    restart: always
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./npm-data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - agri-net

  redis:
    image: redis:7.4-alpine
    container_name: asa-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - asa-redis-data:/data
    networks:
      - agri-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: asa-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - agri-net

  ai-service:
    image: asia-southeast1-docker.pkg.dev/project-f338c3d2-64dd-47cd-873/agri-scan-repo/asa-ai:v1
    container_name: asa-ai
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq
    env_file:
      - .env.ai
    volumes:
      - ./models:/app/models
    networks:
      - agri-net

  backend:
    image: asia-southeast1-docker.pkg.dev/project-f338c3d2-64dd-47cd-873/agri-scan-repo/asa-backend:v1
    container_name: asa-backend
    restart: always
    ports:
      - "4000:4000"
    depends_on:
      - redis
      - rabbitmq
      - ai-service
    env_file:
      - .env.backend
    networks:
      - agri-net

  web:
    image: asia-southeast1-docker.pkg.dev/project-f338c3d2-64dd-47cd-873/agri-scan-repo/asa-web:v1
    container_name: asa-web
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - .env.web
    networks:
      - agri-net

volumes:
  asa-redis-data:
  rabbitmq_data:

networks:
  agri-net:
    driver: bridge